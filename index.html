<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Weekend Choices</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0f172a;
      --card: #111827;
      --accent: #ef4444;
      --accent-2: #f59e0b;
      --text: #f9fafb;
      --muted: #cbd5e1;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 60%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .game {
      width: min(860px, 100%);
      background: linear-gradient(160deg, #111827, #0b1220);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.9rem;
      letter-spacing: 0.02em;
    }

    p.subtitle {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .pill {
      background: rgba(148, 163, 184, 0.14);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.95rem;
    }

    .scene {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .scene h2 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      color: #fef2f2;
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    button.choice {
      background: #1f2937;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 10px;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.98rem;
    }

    button.choice:hover {
      border-color: var(--accent-2);
      transform: translateY(-1px);
    }

    .log {
      margin-top: 12px;
      border-top: 1px solid #334155;
      padding-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      min-height: 24px;
    }

    .result {
      display: none;
      margin-top: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.8);
      padding: 14px;
    }

    .result h3 {
      margin-top: 0;
      color: #fde68a;
    }

    .restart {
      margin-top: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>🏁 Mini F1 Weekend Choices Game</h1>
    <p class="subtitle">Start on media day, then survive practice, qualify up front, and race for glory.</p>

    <section class="hud">
      <div class="pill"><strong>Stage:</strong> <span id="stage">Media Day</span></div>
      <div class="pill"><strong>Reputation:</strong> <span id="reputation">50</span></div>
      <div class="pill"><strong>Car Balance:</strong> <span id="car">50</span></div>
      <div class="pill"><strong>Race Pace:</strong> <span id="pace">50</span></div>
    </section>

    <section class="scene">
      <h2 id="title"></h2>
      <p id="prompt"></p>
      <div class="choices" id="choices"></div>
      <div class="log" id="log"></div>
      <div class="result" id="result"></div>
    </section>
  </main>

  <script>
    const rounds = [
      {
        stage: "Media Day",
        title: "Thursday press duties",
        prompt: "A reporter asks whether your team can challenge for pole. How do you answer?",
        choices: [
          { text: "Stay calm: 'We focus on execution and small gains.'", rep: 8, car: 4, pace: 0, log: "The garage likes your mature tone." },
          { text: "Bold claim: 'We're absolutely taking pole tomorrow.'", rep: 5, car: -2, pace: 1, log: "Big confidence... now pressure is sky-high." },
          { text: "Play mind games with rivals.", rep: -5, car: 2, pace: 0, log: "Fans laugh, but journalists call it unnecessary." }
        ]
      },
      {
        stage: "Practice",
        title: "Friday FP2 setup direction",
        prompt: "Your engineer asks: optimize one-lap speed or long-run stability?",
        choices: [
          { text: "Prioritize long-run stability.", rep: 3, car: 6, pace: 8, log: "Tyre wear improves on heavy fuel." },
          { text: "Chase one-lap speed now.", rep: 2, car: 7, pace: 2, log: "The car feels rapid over one lap." },
          { text: "Split runs and gather broad data.", rep: 4, car: 4, pace: 5, log: "Balanced data set, fewer surprises later." }
        ]
      },
      {
        stage: "Qualifying",
        title: "Q3 final run",
        prompt: "Track is improving quickly. When do you leave the garage?",
        choices: [
          { text: "Go early for a clean lap.", rep: 3, car: 3, pace: 4, log: "Safe lap on the board, but not peak grip." },
          { text: "Wait until the final minute.", rep: 1, car: 0, pace: 9, log: "Huge grip at the end—if traffic stays clear." },
          { text: "Push out mid-session and prepare two laps.", rep: 5, car: 5, pace: 6, log: "Strong compromise: rhythm plus timing." }
        ]
      },
      {
        stage: "Race",
        title: "Sunday strategy call",
        prompt: "A safety car appears on lap 24. Pit now or stay out?",
        choices: [
          { text: "Pit immediately for fresh mediums.", rep: 6, car: 4, pace: 10, log: "Great undercut window—track position gained." },
          { text: "Stay out and defend track position.", rep: 2, car: 2, pace: 4, log: "You lead now, but older tyres will hurt later." },
          { text: "Mirror your closest rival's move.", rep: 4, car: 3, pace: 6, log: "Low risk, moderate reward." }
        ]
      }
    ];

    let state;

    function resetGame() {
      state = { index: 0, reputation: 50, car: 50, pace: 50, logs: [] };
      document.getElementById("result").style.display = "none";
      renderRound();
    }

    function applyChoice(choice) {
      state.reputation = clamp(state.reputation + choice.rep);
      state.car = clamp(state.car + choice.car);
      state.pace = clamp(state.pace + choice.pace);
      state.logs.push(choice.log);
      state.index += 1;
      renderRound();
    }

    function clamp(value) {
      return Math.max(0, Math.min(100, value));
    }

    function renderRound() {
      updateHud();
      const titleEl = document.getElementById("title");
      const promptEl = document.getElementById("prompt");
      const choicesEl = document.getElementById("choices");
      const logEl = document.getElementById("log");
      const resultEl = document.getElementById("result");

      if (state.index >= rounds.length) {
        titleEl.textContent = "Weekend complete ✅";
        promptEl.textContent = "Your decisions shaped the final result.";
        choicesEl.innerHTML = "";
        const score = Math.round((state.reputation + state.car + state.pace) / 3);
        let finish = "P10";
        let ending = "You scored points after a scrappy but solid race.";

        if (score >= 85) {
          finish = "P1";
          ending = "Masterclass weekend. Pole, fastest lap, and a race win.";
        } else if (score >= 70) {
          finish = "P3";
          ending = "Podium finish with strong race craft and tyre management.";
        } else if (score >= 55) {
          finish = "P6";
          ending = "Clean weekend: good qualifying and decent race pace.";
        }

        resultEl.style.display = "block";
        resultEl.innerHTML = `
          <h3>Final Classification: ${finish}</h3>
          <p>${ending}</p>
          <p><strong>Score:</strong> ${score}/100</p>
          <button class="restart" onclick="resetGame()">Run Another Weekend</button>
        `;
        logEl.textContent = state.logs[state.logs.length - 1] || "Great work out there.";
        document.getElementById("stage").textContent = "Finished";
        return;
      }

      const round = rounds[state.index];
      titleEl.textContent = round.title;
      promptEl.textContent = round.prompt;
      logEl.textContent = state.logs[state.logs.length - 1] || "Make your first call.";

      choicesEl.innerHTML = "";
      round.choices.forEach((choice) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = choice.text;
        btn.addEventListener("click", () => applyChoice(choice));
        choicesEl.appendChild(btn);
      });
    }

    function updateHud() {
      const currentStage = state.index < rounds.length ? rounds[state.index].stage : "Finished";
      document.getElementById("stage").textContent = currentStage;
      document.getElementById("reputation").textContent = state.reputation;
      document.getElementById("car").textContent = state.car;
      document.getElementById("pace").textContent = state.pace;
    }

    resetGame();
  </script>
</body>
</html>
